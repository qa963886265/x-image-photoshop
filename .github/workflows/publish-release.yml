name: Publish plugin release

on:
  push:
    branches: [main]
    paths:
      - "release/latest.json"
      - "release/*.zip"

permissions:
  contents: write

concurrency:
  group: publish-plugin-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read release information
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(jq -r '.tag' release/latest.json)"
          title="$(jq -r '.title' release/latest.json)"
          asset="$(jq -r '.asset' release/latest.json)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          if [[ "$asset" != "$(basename "$asset")" || "$asset" != *.zip ]]; then
            echo "Invalid release asset name: $asset" >&2
            exit 1
          fi
          if [[ ! -f "release/$asset" ]]; then
            export PLUGIN_ASSET="$asset"
            python3 - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          plugin = Path("plugin")
          info = json.loads(Path("release/latest.json").read_text())
          manifest = json.loads((plugin / "manifest.json").read_text())
          assert info["tag"] == "v" + info["version"] == "v" + manifest["version"]
          assert (plugin / "auto-selection/JXAutoSelection/JXAutoSelectionFile.exe").is_file()
          with zipfile.ZipFile(Path("release") / os.environ["PLUGIN_ASSET"], "w", zipfile.ZIP_DEFLATED, compresslevel=6) as archive:
              for path in sorted(plugin.rglob("*")):
                  if path.is_file():
                      assert path.suffix.lower() not in {".onnx", ".pt", ".safetensors"}
                      archive.write(path, path.relative_to(plugin).as_posix())
          PY
          fi
          jq -r '.notes' release/latest.json > release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          ASSET: ${{ steps.release.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md
            while IFS= read -r old_asset; do
              if [[ -n "$old_asset" && "$old_asset" != "$ASSET" ]]; then
                gh release delete-asset "$TAG" --yes -- "$old_asset"
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            gh release upload "$TAG" "release/$ASSET" --clobber
          else
            gh release create "$TAG" "release/$ASSET" --target "$GITHUB_SHA" --latest --title "$TITLE" --notes-file release-notes.md
          fi
